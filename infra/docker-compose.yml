# ---------------------------------------------------------------------------
# Multi-Tenant Scheduling Framework — local dev stack (ATOM-LOCAL-DEV-003)
#
# Port mapping:
#   postgres         5432  PostgreSQL 15
#   redis            6379  Redis 7
#   kafka            9092  Kafka broker (KRaft mode, no ZooKeeper)
#   schema-registry  8081  Confluent Schema Registry
#   kafka-ui         8080  Kafka UI (provectuslabs)
#   debezium         8083  Debezium Connect REST (CDC for outbox pattern)
#   notification     8090  notification-service (Kafka consumer, Phase 3)
#   audit            8091  audit-service (Kafka consumer, HIPAA ledger, Phase 3)
#
# Usage:
#   docker compose up -d      start everything
#   docker compose down       stop containers
#   docker compose down -v    stop and remove the postgres data volume
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:15
    container_name: scheduler-postgres
    # wal_level=logical required by Debezium CDC (ATOM-KAFKA-003 / ADR-003)
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=4", "-c", "max_replication_slots=4"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scheduler}
      POSTGRES_USER: ${POSTGRES_USER:-scheduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scheduler_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scheduler-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: scheduler-kafka
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: scheduler-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: scheduler-kafka-ui
    depends_on:
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    ports:
      - "8080:8080"

  debezium:
    image: debezium/connect:2.6
    container_name: scheduler-debezium
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: debezium-connect
      CONFIG_STORAGE_TOPIC: debezium-configs
      OFFSET_STORAGE_TOPIC: debezium-offsets
      STATUS_STORAGE_TOPIC: debezium-status
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: scheduler-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka/topics.sh:/topics.sh
    entrypoint: ["/bin/bash", "/topics.sh"]
    restart: "no"

  # Registers the Debezium outbox connector once Connect is healthy
  # (TASK: ATOM-KAFKA-003; idempotent — safe on every `docker compose up`).
  debezium-init:
    image: curlimages/curl:8.8.0
    container_name: scheduler-debezium-init
    depends_on:
      debezium:
        condition: service_healthy
    environment:
      CONNECT_URL: http://debezium:8083
      CONFIG_FILE: /kafka/debezium-outbox-connector.json
    volumes:
      - ./kafka/register-connector.sh:/kafka/register-connector.sh:ro
      - ./kafka/debezium-outbox-connector.json:/kafka/debezium-outbox-connector.json:ro
    entrypoint: ["/bin/sh", "/kafka/register-connector.sh"]
    restart: "no"

  # Kafka consumer: booking lifecycle -> SES/Twilio dispatch (TASK: ATOM-KAFKA-007)
  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    container_name: scheduler-notification-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/scheduler
      DB_USER: scheduler
      DB_PASSWORD: scheduler_dev
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SES_FROM_ADDRESS: no-reply@scheduler.local
      TWILIO_FROM_NUMBER: "+15005550006"
    ports:
      - "8090:8090"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

  # Kafka consumer: booking lifecycle -> append-only audit ledger
  # (TASK: ATOM-KAFKA-009). Connects as audit_writer (INSERT-only, RLS).
  audit-service:
    build:
      context: ..
      dockerfile: services/audit-service/Dockerfile
    container_name: scheduler-audit-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/scheduler
      AUDIT_DB_USER: audit_writer
      AUDIT_DB_PASSWORD: audit_writer_dev
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    ports:
      - "8091:8091"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Observability stack (ATOM-INFRA-508): Prometheus + Alertmanager + Grafana.
  #   prometheus    9090  scrapes /actuator/prometheus; evaluates alert-rules
  #   alertmanager  9093  routes alerts to Slack (webhook from SLACK_WEBHOOK_URL)
  #   grafana       3001  dashboards (7-panel scheduler dashboard auto-provisioned)
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: scheduler-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: scheduler-alertmanager
    # Slack webhook injected from the environment — never committed in config.
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: scheduler-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana-dashboard.json:/var/lib/grafana/dashboards/scheduler.json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
